name: CI/CD Docker

on:
  push:
    branches: [ "main" ]
    # paths:
    #   - "Dockerfile"
    #   - "docker-compose.yml"
    #   - "src/**"
    #   - "app/**"   
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Resolve targets and deploy via SSM
        shell: bash
        run: |
          set -euo pipefail
          REGION=ap-northeast-2

          # 1) SSM에 Online으로 등록된 인스턴스를 태그(Role=was)로 우선 조회
          SSM_IDS=$(aws ssm describe-instance-information \
            --region "$REGION" \
            --filters "Key=tag:Role,Values=was" "Key=PingStatus,Values=Online" \
            --query "InstanceInformationList[].InstanceId" \
            --output text | xargs -n1 | sort -u | tr '\n' ' ')

          # 2) 없으면 EC2에서 Role=was + running 조회 후 SSM Online만 필터링
          if [ -z "$SSM_IDS" ]; then
            echo "No Online SSM instances found by tag. Fallback to EC2 -> SSM filter..."
            EC2_IDS=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters "Name=tag:Role,Values=was" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text | xargs -n1 | sort -u | tr '\n' ' ')
            if [ -z "$EC2_IDS" ]; then
              echo "No running EC2 instances with tag Role=was."
              exit 1
            fi
            CSV=$(echo "$EC2_IDS" | xargs -n1 | paste -sd, -)
            SSM_IDS=$(aws ssm describe-instance-information \
              --region "$REGION" \
              --filters "Key=InstanceIds,Values=${CSV}" "Key=PingStatus,Values=Online" \
              --query "InstanceInformationList[].InstanceId" \
              --output text | xargs -n1 | sort -u | tr '\n' ' ')
          fi

          if [ -z "$SSM_IDS" ]; then
            echo "Found EC2 instances, but none are SSM Online. Check SSM Agent/IAM/Network."
            exit 1
          fi

          echo "Targeting instances: $SSM_IDS"

          # 3) SSM로 배포 실행
          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids $SSM_IDS \
            --comment "Sparse checkout deploy" \
            --parameters 'commands=["set -e","cd /home/ykk-admin/app","echo Fetch latest changes","git fetch origin main","echo Update sparse directory only","git checkout origin/main -- 03_docker/was_server","echo Restart docker compose","cd 03_docker/was_server","docker compose down || true","docker compose up -d --build","echo Deploy complete"]'