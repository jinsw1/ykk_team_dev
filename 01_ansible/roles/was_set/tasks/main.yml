---

- name: Get DB IP from Terraform
  command: terraform output -raw instance_db_private_ip
  register: db_ip

- name: Create .env file
  copy:
    dest: /home/ykk-admin/app/03_docker/was_server/.env
    content: |
      DB_HOST={{ db_ip.stdout }}
      DB_USER=scott
      DB_PASSWORD=tiger
      DB_NAME=lunch_db
      DB_PORT=5432

- name: Ensure app directory exists
  file:
    path: /home/ykk-admin/app
    state: directory
    owner: ykk-admin
    group: ykk-admin

- name: Check git repo exists
  stat:
    path: /home/ykk-admin/app/.git
  register: git_repo

- name: Clone repo (first time only)
  become_user: ykk-admin
  shell: |
    git clone --no-checkout https://github.com/jinsw1/ykk_team_dev.git /home/ykk-admin/app
  args:
    creates: /home/ykk-admin/app/.git

- name: Enable sparse checkout
  become_user: ykk-admin
  shell: |
    cd /home/ykk-admin/app
    git sparse-checkout init --cone
    git sparse-checkout set 03_docker/was_server

- name: Fetch latest changes
  become_user: ykk-admin
  shell: |
    cd /home/ykk-admin/app
    git fetch origin main

- name: Reset to latest commit
  become_user: ykk-admin
  shell: |
    cd /home/ykk-admin/app
    git checkout main
    git reset --hard origin/main

- name: Run docker compose
  become_user: ykk-admin
  shell: |
    cd /home/ykk-admin/app/03_docker/was_server
    docker compose up -d --build