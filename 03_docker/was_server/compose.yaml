services:
  nginx:
    image: nginx:latest
    container_name: was-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/dev/conf.d:/etc/nginx/conf.d:ro
      # 로그 저장
      - ./logs:/var/log/nginx

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"      
    # depends_on:
    #   - fastapi
    networks:
      - app-network

  ykk-app:
    #image: ykk/lunch-app:latest
    image: jinsw1/ykk-app-test:latest    
    ports:
      - "8000:8000"

  # fastapi:
  #   image: your-dockerhub-user/myapp:latest
  #   container_name: fastapi
  #   expose:
  #     - "8000"      

  # fastapi:
  #   image: ghcr.io/your-org/fastapi:latest
  #   container_name: was-fastapi
  #   restart: always
  #   expose:
  #     - "8000"
  #   env_file:
  #     - ./env/.env.dev   # 기본값 (override에서 변경)
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge